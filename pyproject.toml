[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "genomeprep"
dynamic = ["version"]
description = "Preprocess, quality control and prepare consumer DTC genomes for research"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "pyfaidx>=0.7.0",
    "platformdirs>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
]

[project.scripts]
genomeprep = "genomeprep.cli:main"

[tool.hatch.version]
path = "genomeprep/__init__.py"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
